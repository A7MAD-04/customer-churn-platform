services:
  notebook:
    image: jupyter/scipy-notebook:latest
    ports:
      - "8888:8888"
    volumes:
      - ./notebook:/home/jovyan/work
      - ./data:/home/jovyan/data
    environment:
      - JUPYTER_ENABLE_LAB=yes

  api:
    build: ./api
    ports:
      - "8000:8000"
    volumes:
      - ./model:/model
      - ./data:/model/data
    command: >
      sh -c "python retrain.py && uvicorn main:app --host 0.0.0.0 --port 8000"